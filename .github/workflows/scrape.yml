name: Daily price scrape

on:
  schedule:
    - cron: "0 5 * * *" # ~09:00 Gulf Standard Time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    # Set repo variable RUNNER_LABEL to 'self-hosted' to run from your own
    # UAE machine instead of GitHub's datacenter IPs (see SETUP.md).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium || playwright install chromium

      - name: Run scraper
        shell: bash
        run: python -m scraper.run

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest-prices.json docs/data/price-history.csv
          git diff --cached --quiet || git commit -m "chore: daily price update $(date -u +%Y-%m-%d)"
          git push
