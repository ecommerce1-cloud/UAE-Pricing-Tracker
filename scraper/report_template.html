<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UAE Pricing Tracker &mdash; __STAMP__</title>
<style>
:root{--bg:#0f1115;--surface:#171a21;--s2:#1f232c;--bd:#2a2f3a;--tx:#e8eaed;--dim:#9aa1ac;--acc:#5b9dff;--warn:#e0a83e;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);padding:24px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--dim);font-size:.82rem;margin-top:4px}
button{background:var(--acc);color:#0b1220;border:0;border-radius:8px;padding:9px 16px;font-size:.85rem;font-weight:600;cursor:pointer}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px}
thead th{position:sticky;top:0;background:var(--s2);border-bottom:1px solid var(--bd);padding:10px 12px;text-align:left;font-size:.78rem;color:var(--dim);white-space:nowrap}
.ph{display:flex;flex-direction:column;align-items:center;gap:4px}
.ph img{height:20px}
tbody td{padding:10px 12px;border-bottom:1px solid var(--bd);font-size:.88rem;vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.02)}
.bc{font-family:Consolas,monospace;font-size:.83rem;color:var(--dim);white-space:nowrap}
.pn{font-weight:500}
.pc{text-align:center}
.price{font-weight:600}
.na{color:var(--dim);font-style:italic;cursor:help}
.na.blocked{color:var(--warn);font-style:normal}
.ztog{display:block;margin-top:2px;font-size:.7rem;color:var(--acc);cursor:pointer}
.zbreak{margin-top:6px;text-align:left;font-size:.74rem;color:var(--dim);border-top:1px dashed var(--bd);padding-top:6px}
.zbreak div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.hide{display:none}
</style></head><body>
<header>
  <div><h1>UAE Pricing Tracker</h1>
  <div class="sub">__COUNT__ barcode(s) &middot; Amazon.ae, Amazon Now, Noon, Noon Minutes &amp; Talabat Mart &middot; checked __STAMP__</div></div>
  <button id="x">Export CSV</button>
</header>
<div class="wrap"><table>
<thead><tr><th>Barcode</th><th>Product</th>__HEAD_CELLS__</tr></thead>
<tbody>__BODY_ROWS__</tbody>
</table></div>
<script>
const ROWS = __ROWS_JSON__;
document.querySelectorAll('.ztog').forEach(function (t) {
  t.addEventListener('click', function () { t.nextElementSibling.classList.toggle('hide'); });
});
document.getElementById('x').addEventListener('click', function () {
  var csv = ROWS.map(function (r) {
    return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'uae-prices-__DATE__.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
</script></body></html>
